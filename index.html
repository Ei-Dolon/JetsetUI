<!doctype html>
<html lang="en">
	<head>
		<script type="module">
			if (typeof global === 'undefined') {
				window.global = window;
			}
		</script>
		<meta charset="UTF-8" />
		<meta
			name="description"
			content="Jetset DApp Frontend" />

		<meta
			name="viewport"
			content="width=360, initial-scale=1.0, maximum-scale=1.0" />
		<!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    Prevent horizontal scroll within the DApp content itself -->

		<meta
			name="mobile-web-app-capable"
			content="yes" />
		<meta
			name="apple-mobile-web-app-capable"
			content="yes" />

		<link
			rel="stylesheet"
			href="./src/index.css" />
		<link
			rel="manifest"
			href="/manifest.json" />
		<!-- Favicons -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="/jetset.svg" />
		<link
			rel="apple-touch-icon"
			href="/icons/jetset.svg" />

		<!-- Title -->
		<title>JetsetUI - Jetset DApp Frontend</title>

		<!-- Preconnect: price API -->
		<link
			rel="dns-prefetch"
			href="https://api.coingecko.com/"
			crossorigin />
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this DApp.</noscript>
		<div id="root"></div>
		<div id="modal-root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
